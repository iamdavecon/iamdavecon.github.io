<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>DaveCon | Badge Wall</title>
  <style>
    :root {
      --ink: #f4fff8;
      --paper: #050508;
      --panel: rgba(9, 14, 22, 0.9);
      --panel-strong: rgba(12, 18, 30, 0.98);
      --red: #ff3158;
      --gold: #faff00;
      --mint: #00ff9f;
      --blue: #00d9ff;
      --violet: #b967ff;
      --muted: #99afbd;
      --border: 1px solid rgba(0, 255, 159, 0.72);
      --shadow: 0 0 28px rgba(0, 217, 255, 0.18), 0 0 58px rgba(255, 49, 88, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(0, 255, 159, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px),
        radial-gradient(circle at 18% 8%, rgba(255, 49, 88, 0.24), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(0, 217, 255, 0.2), transparent 30%),
        linear-gradient(135deg, #030305 0%, #08111b 48%, #040407 100%);
      background-size: 36px 36px, 36px 36px, cover, cover, cover;
      font-family: "Trebuchet MS", Arial, sans-serif;
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.035) 0,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 1px,
        transparent 5px
      );
      mix-blend-mode: screen;
    }

    a {
      color: inherit;
    }

    .shell {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 20px 0 10px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-size: 1.05rem;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: var(--border);
      background: #050508;
      color: var(--gold);
      box-shadow: 0 0 18px rgba(250, 255, 0, 0.65);
      transform: rotate(-3deg);
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .nav-links a {
      padding: 7px 10px;
      border: 2px solid transparent;
      text-decoration: none;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      border-color: var(--blue);
      background: rgba(0, 217, 255, 0.1);
      color: var(--gold);
      outline: none;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
      padding: 10px 0 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      padding: 6px 10px;
      border: 1px solid var(--mint);
      background: rgba(0, 255, 159, 0.12);
      color: var(--mint);
      box-shadow: 0 0 18px rgba(0, 255, 159, 0.28);
      font-size: 0.9rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 880px;
      margin-bottom: 12px;
      color: var(--gold);
      font-size: clamp(3.2rem, 10vw, 7.5rem);
      line-height: 0.86;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 4px 0 0 rgba(255, 49, 88, 0.74), -4px 0 0 rgba(0, 217, 255, 0.58), 0 0 34px rgba(250, 255, 0, 0.5);
    }

    h2 {
      margin-bottom: 16px;
      color: var(--blue);
      font-size: clamp(2rem, 5vw, 4.1rem);
      line-height: 0.95;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(0, 217, 255, 0.55);
    }

    h3 {
      margin-bottom: 8px;
      font-size: 1.18rem;
      line-height: 1.12;
      text-transform: uppercase;
    }

    .hero-copy {
      max-width: 720px;
      margin-bottom: 0;
      color: #d8f8ff;
      font-size: clamp(1.1rem, 2.2vw, 1.45rem);
      font-weight: 700;
    }

    .controls {
      border: var(--border);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    main {
      padding: 8px 0 48px;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 22px;
      padding: 12px;
      backdrop-filter: blur(14px);
    }

    label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    input,
    select,
    button {
      min-height: 42px;
      border-radius: 0;
      font: inherit;
      font-weight: 800;
    }

    input,
    select {
      width: 100%;
      border: 1px solid rgba(0, 217, 255, 0.58);
      background: #050508;
      color: var(--ink);
      padding: 9px 10px;
    }

    button {
      border: 1px solid rgba(250, 255, 0, 0.8);
      background: rgba(250, 255, 0, 0.12);
      color: var(--gold);
      cursor: pointer;
      padding: 9px 12px;
      text-transform: uppercase;
    }

    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .control-field {
      display: grid;
      gap: 5px;
    }

    .wall-layout {
      display: block;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .badge-card {
      display: grid;
      gap: 12px;
      min-height: 390px;
      padding: 12px;
      border: 1px solid rgba(153, 175, 189, 0.32);
      background: rgba(5, 5, 8, 0.72);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 0 0 rgba(0, 0, 0, 0);
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .badge-card:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 0 24px rgba(250, 255, 0, 0.22);
      outline: none;
    }

    .badge-card.pending {
      opacity: 0.74;
    }

    .badge-art {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 188px;
      overflow: hidden;
      border: 1px solid var(--accent);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 32%, transparent), transparent 45%),
        radial-gradient(circle at 70% 20%, color-mix(in srgb, var(--second) 35%, transparent), transparent 32%),
        #050508;
      isolation: isolate;
    }

    .badge-art::before {
      content: "";
      position: absolute;
      width: 122px;
      height: 154px;
      border: 3px solid var(--accent);
      background:
        linear-gradient(90deg, transparent 48%, color-mix(in srgb, var(--accent) 60%, transparent) 49% 51%, transparent 52%),
        repeating-linear-gradient(0deg, color-mix(in srgb, var(--second) 32%, transparent) 0 5px, transparent 5px 12px),
        rgba(255, 255, 255, 0.035);
      clip-path: polygon(14% 0, 86% 0, 100% 18%, 100% 78%, 50% 100%, 0 78%, 0 18%);
      box-shadow: 0 0 26px color-mix(in srgb, var(--accent) 48%, transparent);
      transform: rotate(var(--tilt));
      z-index: -1;
    }

    .badge-art::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px dashed color-mix(in srgb, var(--second) 72%, transparent);
      opacity: 0.72;
    }

    .badge-art.has-image {
      background:
        radial-gradient(circle at 50% 45%, rgba(244, 255, 248, 0.12), transparent 54%),
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 24%, transparent), rgba(5, 5, 8, 0.92));
    }

    .badge-art.has-image::before,
    .badge-art.has-image::after {
      opacity: 0.38;
    }

    .badge-art img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 176px;
      object-fit: contain;
      padding: 10px;
      filter: drop-shadow(0 0 16px color-mix(in srgb, var(--accent) 50%, transparent));
    }

    .badge-year {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      border: 2px solid var(--gold);
      background: rgba(5, 5, 8, 0.86);
      color: var(--gold);
      font-size: 1.55rem;
      font-weight: 900;
      text-shadow: 0 0 14px rgba(250, 255, 0, 0.58);
    }

    .badge-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .badge-meta span {
      border: 1px solid rgba(153, 175, 189, 0.32);
      padding: 4px 6px;
      background: rgba(153, 175, 189, 0.08);
    }

    .synopsis {
      margin: 0;
      color: #d8f8ff;
      font-size: 0.96rem;
    }

    .content-search {
      margin-bottom: 22px;
      padding: 14px;
      border: var(--border);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .content-search-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .content-search h2 {
      margin: 18px 0 10px;
      font-size: clamp(1.35rem, 4vw, 2.2rem);
    }

    .result-list {
      display: grid;
      gap: 12px;
    }

    .result-card {
      padding: 12px;
      border: 1px solid rgba(153, 175, 189, 0.32);
      background: rgba(5, 5, 8, 0.72);
    }

    .result-card h3 {
      margin-bottom: 6px;
      color: var(--gold);
    }

    .result-card a {
      text-decoration: none;
    }

    .result-card a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .snippet {
      margin: 8px 0 0;
      color: #d8f8ff;
      font-size: 0.94rem;
    }

    mark {
      background: rgba(250, 255, 0, 0.26);
      color: var(--ink);
      padding: 0 2px;
    }

    .empty {
      display: none;
      padding: 26px;
      border: 1px solid rgba(255, 49, 88, 0.58);
      background: rgba(255, 49, 88, 0.08);
      color: #ffd8df;
      font-weight: 900;
      text-transform: uppercase;
    }

    .empty.show {
      display: block;
    }

    footer {
      padding: 24px 0 36px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 920px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      nav,
      .controls {
        grid-template-columns: 1fr;
      }

      nav {
        align-items: flex-start;
      }

      .nav-links {
        justify-content: flex-start;
      }

      .controls {
        position: static;
      }

      .content-search-form {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>
<body>
  <header class="shell">
    <nav aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="DaveCon home">
        <span class="brand-mark">D</span>
        <span>DaveCon</span>
      </a>
      <div class="nav-links">
        <a href="index.html">/home</a>
      </div>
    </nav>

    <div class="hero">
      <div>
        <p class="eyebrow">Virtual badge wall</p>
        <h1>Badge Wall</h1>
        <!--<p class="hero-copy">A clickable shelf of DEF CON, DaveCon, and PhreakNIC write-ups. </p>-->
      </div>
    </div>
  </header>

  <main class="shell" id="wall">
    <section class="controls" aria-label="Badge wall controls">
      <div class="control-field">
        <input id="search" type="search" placeholder="Filter by year, venue, synopsis...">
      </div>
    </section>

    <section class="content-search" id="content-search" aria-label="Write-up content search">
      <form class="content-search-form" id="content-search-form">
        <div class="control-field">
          <label for="content-search-input">Search write-ups</label>
          <input id="content-search-input" type="search" placeholder="Toxic BBQ, tacos, badge hacking...">
        </div>
        <button type="submit">Search</button>
      </form>
      <h2 id="content-search-summary">Enter a search term</h2>
      <div class="result-list" id="content-search-results" aria-live="polite"></div>
    </section>

    <section class="wall-layout">
      <div>
        <div class="empty" id="empty-state">No badges match that filter.</div>
        <div class="badge-grid" id="badge-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="shell">
    
  </footer>

  <script src="badge-wall-search-data.js"></script>

      { title: "2023 - DEF CON 31 / DaveCon 2.1", year: 2023, event: "DEF CON", location: "Caesars Forum", attendees: "25,000", words: 0, count: 17, image: "badge-wall/DC31.png", link: "https://docs.google.com/document/d/19L7Xp_Kvz2vSCQtCk9RlQ3hHlzpowm8FXnbNuoqx-NI/edit", synopsis: "DaveCon 2.1 keeps building the mythos around DEF CON 31, with badge distribution, friends, jokes that become systems, and the Caesars Forum crowd flow." },
      { title: "2023 - PhreakNIC 24", year: 2023, event: "PhreakNIC", location: "Clarion", attendees: "157", words: 0, count: 4, image: "badge-wall/PN24.png", link: "https://docs.google.com/document/d/1n4aDrIvLtfdLTO3mX3DbZxsHTg_jl_SsO1NS2ok_07Q/edit", synopsis: "A tiny-by-comparison PhreakNIC 24, just 157 attendees, with the Clarion giving the write-up a more intimate, local, close-quarters hacker feel." },
      { title: "2024 - DEF CON 32 / DaveCon 3.14", year: 2024, event: "DEF CON", location: "LVCC", attendees: "27,000", words: 0, count: 18, image: "badge-wall/DC32.png", link: "https://docs.google.com/document/d/1oaGeMpaKX69vDvRT8u-n9noyw66Tj9VWQcM_10Sb85A/edit", synopsis: "DaveCon 3.14 lands at LVCC with $2 hot dogs, Dave badges, Toxic BBQ, badge hacking, Hacker Jeopardy, cheese diplomacy, sticker swarms, and the ongoing search for a new hub bar." },
      { title: "2025 - DEF CON 33 / DaveCon 4.2", year: 2025, event: "DEF CON", location: "LVCC", attendees: "26,000", words: 0, count: 19, image: "badge-wall/DC33.png", link: "https://docs.google.com/document/d/1AzK0nzqCdaiZECCq4kKoY3V3NjuLak1vkBxOy_BbJ88", synopsis: "The DaveCon 4.2 row points to the newest linked write-up: LVCC again, a fresh badge year, and the next iteration of the DaveCon running joke turned field operation." },
      { title: "2026 - DEF CON 34 / DaveCon V", year: 2026, event: "DEF CON", location: "LVCC", attendees: "", words: 0, count: 20, link: "", synopsis: "Future row from the index: DEF CON 34 and DaveCon V are staged for LVCC, with the write-up link still pending." }
    ];

    const palette = [
      ["#00ff9f", "#ff3158"], ["#00d9ff", "#faff00"], ["#b967ff", "#00ff9f"],
      ["#ff3158", "#00d9ff"], ["#faff00", "#b967ff"], ["#7cffcb", "#ff7a3d"]
    ];

    const grid = document.querySelector("#badge-grid");
    const emptyState = document.querySelector("#empty-state");
    const search = document.querySelector("#search");
    const contentSearchForm = document.querySelector("#content-search-form");
    const contentSearchInput = document.querySelector("#content-search-input");
    const contentSearchSummary = document.querySelector("#content-search-summary");
    const contentSearchResults = document.querySelector("#content-search-results");

    function styleForBadge(badge) {
      const colors = palette[(badge.year + badge.count) % palette.length];
      const tilt = ((badge.count || badge.year) % 7) - 3;
      return `--accent:${colors[0]};--second:${colors[1]};--tilt:${tilt}deg;`;
    }

    function metaText(badge) {
      const bits = [badge.location];
      if (badge.attendees) bits.push(`${badge.attendees} attendees`);
      if (badge.words) bits.push(`${badge.words.toLocaleString()} words`);
      if (badge.count) bits.push(`#${badge.count}`);
      return bits.filter(Boolean);
    }

    function badgeArt(badge) {
      if (badge.image) {
        return `
          <div class="badge-art has-image" style="${styleForBadge(badge)}" role="img" aria-label="Badge thumbnail for ${badge.title}">
            <img src="${badge.image}" alt="${badge.title} badge thumbnail" loading="lazy">
          </div>
        `;
      }

      return `
        <div class="badge-art" style="${styleForBadge(badge)}" role="img" aria-label="Generated badge art for ${badge.title}">
          <span class="badge-year">${badge.year}</span>
        </div>
      `;
    }

    function matchesFilters(badge) {
      const term = search.value.trim().toLowerCase();
      const haystack = `${badge.title} ${badge.event} ${badge.location} ${badge.attendees} ${badge.synopsis}`.toLowerCase();
      return !term || haystack.includes(term);
    }

    function render() {
      const visible = badges.filter(matchesFilters)
        .sort((a, b) => b.year - a.year || b.title.localeCompare(a.title));

      grid.innerHTML = visible.map((badge) => {
        const href = badge.link || "#wall";
        const classes = ["badge-card", badge.link ? "" : "pending"].filter(Boolean).join(" ");
        return `
          <a class="${classes}" href="${href}" data-title="${badge.title}" ${badge.link ? "" : "aria-disabled=\"true\""}>
            ${badgeArt(badge)}
            <div>
              <h3>${badge.title}</h3>
              <div class="badge-meta">${metaText(badge).map((item) => `<span>${item}</span>`).join("")}</div>
            </div>
            <p class="synopsis">${badge.synopsis}</p>
          </a>
        `;
      }).join("");

      emptyState.classList.toggle("show", visible.length === 0);
    }

    grid.addEventListener("click", (event) => {
      const card = event.target.closest(".badge-card");
      if (!card) return;
      const badge = badges.find((item) => item.title === card.dataset.title);
      if (!badge) return;
      if (!badge.link) event.preventDefault();
    });

    search.addEventListener("input", render);

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function badgeForDocument(doc) {
      return badges.find((badge) => badge.link && badge.link.includes(doc.id));
    }

    function parseContentQuery(value) {
      const raw = value.trim();
      const quoted = raw.length >= 2 && raw.startsWith('"') && raw.endsWith('"');
      const term = quoted ? raw.slice(1, -1).trim() : raw;
      return { term, quoted };
    }

    function normalizeSearchText(value) {
      return value
        .toLowerCase()
        .replace(/[\u2018\u2019\u201A\u201B\u2032]/g, "'")
        .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"');
    }

    function isWordChar(char) {
      return /[a-z0-9_]/i.test(char || "");
    }

    function findContentMatches(text, query) {
      const lowerText = normalizeSearchText(text);
      const lowerTerm = normalizeSearchText(query.term);
      const matches = [];
      let index = lowerText.indexOf(lowerTerm);
      while (index !== -1) {
        const before = lowerText[index - 1];
        const after = lowerText[index + lowerTerm.length];
        if (!query.quoted || (!isWordChar(before) && !isWordChar(after))) {
          matches.push(index);
        }
        index = lowerText.indexOf(lowerTerm, index + lowerTerm.length);
      }
      return matches;
    }

    function snippetForMatch(text, query, index) {
      const start = Math.max(0, index - 84);
      const end = Math.min(text.length, index + query.term.length + 116);
      const prefix = start > 0 ? "..." : "";
      const suffix = end < text.length ? "..." : "";
      const snippet = `${prefix}${text.slice(start, end).replace(/\s+/g, " ").trim()}${suffix}`;
      const escapedTerm = query.term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return escapeHtml(snippet).replace(new RegExp(escapedTerm, "gi"), (match) => `<mark>${match}</mark>`);
    }

    function snippetsFor(text, query) {
      const matches = findContentMatches(text, query);
      const snippets = [];
      let lastEnd = -1;
      for (const index of matches) {
        const start = Math.max(0, index - 84);
        if (start <= lastEnd) continue;
        snippets.push(snippetForMatch(text, query, index));
        lastEnd = Math.min(text.length, index + query.term.length + 116);
        if (snippets.length === 5) break;
      }
      return snippets;
    }

    function runContentSearch() {
      const query = parseContentQuery(contentSearchInput.value);
      if (!query.term) {
        contentSearchSummary.textContent = "Enter a search term";
        contentSearchResults.innerHTML = "";
        return;
      }

      const documents = Array.isArray(window.badgeSearchDocuments) ? window.badgeSearchDocuments : [];
      const results = documents.map((doc) => {
        const badge = badgeForDocument(doc);
        const text = doc.text || "";
        const matches = findContentMatches(text, query);
        return { doc, badge, matches: matches.length };
      }).filter((result) => result.matches > 0 && result.badge)
        .sort((a, b) => b.matches - a.matches || b.badge.year - a.badge.year);

      const totalMatches = results.reduce((sum, result) => sum + result.matches, 0);
      contentSearchSummary.textContent = `${results.length} write-ups · ${totalMatches} matches`;
      contentSearchResults.innerHTML = results.length
        ? results.slice(0, 12).map(({ doc, badge, matches }) => `
          <article class="result-card">
            <h3><a href="${badge.link}">${escapeHtml(badge.title)}</a></h3>
            <div class="badge-meta">${metaText(badge).map((item) => `<span>${escapeHtml(item)}</span>`).join("")}<span>${matches} matches</span></div>
            ${snippetsFor(doc.text, query).map((snippet) => `<p class="snippet">${snippet}</p>`).join("")}
          </article>
        `).join("")
        : '<p class="empty show">No write-ups match that search.</p>';
    }

    contentSearchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      runContentSearch();
    });

    render();
  </script>
</body>
